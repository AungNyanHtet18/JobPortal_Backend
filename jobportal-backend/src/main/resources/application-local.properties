spring.datasource.url=jdbc:postgresql://localhost:5432/jobdb
spring.datasource.username=postgres
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update

#Always run SQL initialization scripts /Data will be inserted every restart
spring.sql.init.mode=always 
spring.jpa.show-sql=true

app.upload.path=C:/upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.jwt.issuer = com.dev.anh.job.demo
app.jwt.access-life = 3
app.jwt.refresh-life = 15

spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.time=HH:mm
spring.mvc.format.date-time=yyyy-MM-dd HH:mm

#email configuration
app.mail.from=${mailfrom}
app.mail.name=${mailname}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${gmail}
spring.mail.password=${mailpassword}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

